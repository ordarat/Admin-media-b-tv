<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveZon Studio - OBS Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;700&display=swap');
        
        :root {
            --bg-dark: #121212; --bg-panel: #1e1e1e; --bg-input: #2d2d2d;
            --border-color: #333; --accent-blue: #0078d7; --accent-hover: #005a9e;
            --pvw-green: #28a745; --pgm-red: #dc3545; --text-main: #e0e0e0; --text-muted: #888;
        }

        body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Login Screen */
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .login-box { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 40px; border-radius: 8px; width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-input); border: 1px solid var(--border-color); color: white; border-radius: 4px; box-sizing: border-box; text-align: left; direction: ltr; }
        .btn-login { width: 100%; padding: 12px; background: var(--accent-blue); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }

        /* Top Bar */
        .top-bar { background: var(--bg-panel); border-bottom: 1px solid var(--border-color); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; height: 50px; box-sizing: border-box; }
        .brand { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 20px; color: white; letter-spacing: 1px; }
        .brand span { color: var(--accent-blue); }
        .status-indicators { display: flex; gap: 15px; align-items: center; }
        .badge { padding: 4px 10px; border-radius: 3px; font-family: 'Orbitron'; font-size: 12px; font-weight: bold; }
        .badge-live { background: transparent; border: 1px solid var(--pgm-red); color: var(--pgm-red); }
        .badge-live.active { background: var(--pgm-red); color: white; box-shadow: 0 0 10px var(--pgm-red); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.7; } }

        /* Main Workspace */
        .workspace { display: flex; flex-direction: column; flex: 1; padding: 10px; gap: 10px; overflow: hidden; }

        /* Monitors Section */
        .monitors-row { display: flex; gap: 10px; height: 45%; }
        .monitor-container { flex: 1; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 6px; display: flex; flex-direction: column; }
        .monitor-header { padding: 5px 15px; font-weight: bold; font-family: 'Orbitron'; font-size: 14px; text-align: center; border-bottom: 1px solid var(--border-color); }
        .pvw-header { background: rgba(40, 167, 69, 0.1); color: var(--pvw-green); }
        .pgm-header { background: rgba(220, 53, 69, 0.1); color: var(--pgm-red); }
        .screen { flex: 1; background: black; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .screen iframe { width: 100%; height: 100%; border: none; }
        
        /* Transition Bar */
        .transition-bar { display: flex; justify-content: center; gap: 15px; background: var(--bg-panel); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .btn-trans { padding: 8px 25px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: 'Orbitron'; transition: 0.2s; }
        .btn-cut { background: var(--bg-input); color: white; border: 1px solid var(--border-color); }
        .btn-cut:hover { background: #444; }
        .btn-take { background: var(--pgm-red); color: white; font-size: 16px; padding: 8px 40px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-take:hover { background: #ff4757; }

        /* Bottom Panels Grid */
        .panels-row { display: flex; gap: 10px; height: calc(55% - 70px); }
        .panel { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 6px; display: flex; flex-direction: column; }
        .panel-title { padding: 10px 15px; border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 14px; color: var(--accent-blue); display: flex; justify-content: space-between; }
        .panel-content { padding: 10px; overflow-y: auto; flex: 1; }
        
        /* Specific Panels */
        .scenes-panel { flex: 2; }
        .mixer-panel { flex: 1; }
        .graphics-panel { flex: 1.5; }

        /* Inputs & Buttons inside panels */
        label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px; margin-top: 10px; }
        input[type="text"], select { width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); color: white; padding: 8px; border-radius: 3px; box-sizing: border-box; font-family: inherit; }
        .btn-action { background: var(--bg-input); color: white; border: 1px solid var(--border-color); padding: 8px 15px; border-radius: 3px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-action:hover { background: var(--accent-blue); border-color: var(--accent-blue); }

        /* Audio Mixer Sliders */
        .mixer-track { background: var(--bg-input); padding: 15px; border-radius: 6px; text-align: center; margin-bottom: 10px; border-left: 4px solid var(--accent-blue); }
        .track-name { font-size: 12px; font-weight: bold; margin-bottom: 10px; color: #aaa; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 10px; background: white; cursor: pointer; border-radius: 2px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #111; border-radius: 3px; border: 1px solid #444; }

        /* Playlist / Scenes List */
        .scene-item { background: var(--bg-input); border: 1px solid var(--border-color); padding: 8px 10px; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; cursor: grab; border-left: 3px solid transparent; }
        .scene-item:hover { border-left-color: var(--text-muted); }
        .scene-item.active-pvw { border-left-color: var(--pvw-green); }
        .scene-item.active-pgm { border-left-color: var(--pgm-red); }
        .scene-title { font-size: 13px; font-weight: bold; flex: 1; }
        .scene-controls button { background: none; border: none; color: var(--text-muted); cursor: pointer; }
        .scene-controls button:hover { color: white; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-panel); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>

<!-- Login -->
<div id="loginScreen">
    <div class="login-box">
        <h2 style="font-family:'Orbitron'; margin-bottom: 20px;">LiveZon <span>STUDIO</span></h2>
        <input type="email" id="loginEmail" placeholder="ئیمەیڵ">
        <input type="password" id="loginPass" placeholder="تێپەڕوشە">
        <button class="btn-login" onclick="login()">چوونەژوورەوە</button>
    </div>
</div>

<!-- Main App -->
<div id="appContainer" style="display: none; height: 100%;">
    <!-- Header -->
    <div class="top-bar">
        <div class="brand"><i class="fa-solid fa-video"></i> LIVEZON <span>STUDIO</span></div>
        <div class="status-indicators">
            <span id="syncStatus" style="color: var(--text-muted);"><i class="fa-solid fa-cloud"></i></span>
            <div id="airBadge" class="badge badge-live">OFFLINE</div>
            <button onclick="logout()" style="background: none; border: none; color: var(--text-muted); cursor: pointer;"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </div>

    <div class="workspace">
        <!-- Monitors -->
        <div class="monitors-row">
            <!-- PVW -->
            <div class="monitor-container" style="border: 2px solid var(--pvw-green);">
                <div class="monitor-header pvw-header">PREVIEW (PVW)</div>
                <div class="screen">
                    <div style="color: #444; font-family: 'Orbitron'; font-size: 24px; position: absolute; z-index: 0;">NO SIGNAL</div>
                    <iframe id="pvwScreen" style="position: relative; z-index: 1;"></iframe>
                </div>
            </div>
            
            <!-- PGM -->
            <div class="monitor-container" style="border: 2px solid var(--pgm-red);">
                <div class="monitor-header pgm-header">PROGRAM (PGM)</div>
                <div class="screen">
                    <div style="color: #444; font-family: 'Orbitron'; font-size: 24px; position: absolute; z-index: 0;">OFF AIR</div>
                    <iframe id="pgmScreen" style="position: relative; z-index: 1;"></iframe>
                </div>
            </div>
        </div>

        <!-- Transitions -->
        <div class="transition-bar">
            <button class="btn-trans btn-cut" onclick="masterControl('stop')">CUT (STOP)</button>
            <button class="btn-trans btn-take" onclick="masterControl('play_playlist')">TAKE (PLAY)</button>
        </div>

        <!-- Panels -->
        <div class="panels-row">
            
            <!-- Scenes/Playlist -->
            <div class="panel scenes-panel">
                <div class="panel-title">
                    <span><i class="fa-solid fa-layer-group"></i> SCENES / PLAYLIST</span>
                    <select id="daySelector" onchange="switchDay(this.value)" style="width: auto; padding: 2px; font-size: 11px; background: black;">
                        <option value="Saturday">شەممە</option>
                        <option value="Sunday">یەکشەممە</option>
                        <option value="Monday">دووشەممە</option>
                    </select>
                </div>
                <div class="panel-content" id="playlist">
                    <!-- Items generated by JS -->
                </div>
                <div style="padding: 10px; border-top: 1px solid var(--border-color);">
                    <button class="btn-action" onclick="addScene()"><i class="fa-solid fa-plus"></i> ADD MEDIA SOURCE</button>
                </div>
            </div>

            <!-- Audio Mixer -->
            <div class="panel mixer-panel">
                <div class="panel-title"><span><i class="fa-solid fa-sliders"></i> AUDIO MIXER</span></div>
                <div class="panel-content">
                    <div class="mixer-track">
                        <div class="track-name">MASTER PGM VOL</div>
                        <input type="range" min="0" max="100" value="100">
                        <div style="font-size: 10px; color: var(--accent-blue); margin-top: 5px;">0.0 dB</div>
                    </div>
                    <div class="mixer-track" style="border-left-color: var(--text-muted);">
                        <div class="track-name">PREVIEW VOL</div>
                        <input type="range" min="0" max="100" value="50">
                    </div>
                </div>
            </div>

            <!-- Graphics & Controls -->
            <div class="panel graphics-panel">
                <div class="panel-title"><span><i class="fa-solid fa-object-group"></i> GRAPHICS & OVERLAYS</span></div>
                <div class="panel-content">
                    <label>شریتی هەواڵ (TICKER TEXT)</label>
                    <input type="text" id="tickerText" value="بەخێربێن بۆ کەناڵی میدیا باگێرا">
                    
                    <label>سەرچاوەی لۆگۆ (WATERMARK URL)</label>
                    <input type="text" id="logoUrl" value="https://i.postimg.cc/Kv60DSRk/1000035211-removebg-preview.png" dir="ltr">
                    
                    <label>لینکی چاودێری (MONITOR URL)</label>
                    <input type="text" id="monitorUrl" placeholder="لینکی ok.ru" onchange="updateMonitors()" dir="ltr">
                    
                    <button class="btn-action" style="background: rgba(40,167,69,0.2); border-color: var(--pvw-green); color: var(--pvw-green);" onclick="saveDataToCloud('update_settings')">
                        <i class="fa-solid fa-floppy-disk"></i> SAVE GRAPHICS & SETTINGS
                    </button>
                    
                    <hr style="border: none; border-top: 1px dashed var(--border-color); margin: 20px 0;">
                    
                    <label style="color: var(--pgm-red);"><i class="fa-solid fa-triangle-exclamation"></i> OVERRIDE (هەواڵی بەپەلە)</label>
                    <input type="text" id="quickUrl" placeholder="لینکی ڤیدیۆی بەپەلە لێرە دابنێ..." dir="ltr">
                    <button class="btn-action" style="background: rgba(220,53,69,0.2); border-color: var(--pgm-red); color: var(--pgm-red);" onclick="quickInject()">
                        <i class="fa-solid fa-forward-fast"></i> INJECT NOW
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // --- هەمان کۆدی فایەربەیسی پێشووە بەبێ گۆڕانکاری بۆ ئەوەی ڕاستەوخۆ کار بکات ---
    const firebaseConfig = {
        apiKey: "AIzaSyA_CyVB1f9UCHG_FMmYDSqG3oLGkohfE80",
        authDomain: "media-bagera-63d90.firebaseapp.com",
        databaseURL: "https://media-bagera-63d90-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "media-bagera-63d90",
        storageBucket: "media-bagera-63d90.firebasestorage.app",
        messagingSenderId: "457510380933",
        appId: "1:457510380933:web:c181b17a72d5e4a33dd0ec",
        measurementId: "G-1CVRHFBREB"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database(); 
    
    let isLive = false;
    let isInitialLoad = true;
    let currentEditingDay = "Saturday";
    let weeklySchedule = { "Saturday": [], "Sunday": [], "Monday": [], "Tuesday": [], "Wednesday": [], "Thursday": [], "Friday": [] };
    const daysArr = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            currentEditingDay = daysArr[new Date().getDay()];
            document.getElementById('daySelector').value = currentEditingDay;
            loadDataFromCloud();
        } else {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appContainer').style.display = 'none';
        }
    });

    function login() {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;
        auth.signInWithEmailAndPassword(email, pass).catch(() => alert('زانیارییەکان هەڵەن'));
    }

    function logout() { auth.signOut(); }

    function loadDataFromCloud() {
        document.getElementById('syncStatus').style.color = 'var(--accent-blue)';
        db.ref("system/mcr_data").on("value", (snapshot) => {
            if (snapshot.exists()) {
                const d = snapshot.val();
                let parsedData = {};
                try { parsedData = JSON.parse(d.payload || "{}"); } catch(e) {}
                
                if(d.command === 'play_playlist' || d.command === 'override') {
                    setLiveStatus(true);
                } else if (d.command === 'stop') {
                    setLiveStatus(false);
                }

                if (isInitialLoad) {
                    document.getElementById('tickerText').value = parsedData.t || 'بەخێربێن بۆ کەناڵی میدیا باگێرا'; 
                    document.getElementById('logoUrl').value = parsedData.l || 'https://i.postimg.cc/Kv60DSRk/1000035211-removebg-preview.png';
                    document.getElementById('monitorUrl').value = parsedData.m || '';
                    if (parsedData.schedule) weeklySchedule = Object.assign(weeklySchedule, parsedData.schedule);
                    
                    renderPlaylistForDay(currentEditingDay);
                    updateMonitors();
                    isInitialLoad = false;
                }
            }
            setTimeout(() => document.getElementById('syncStatus').style.color = 'var(--text-muted)', 500);
        });
    }

    function switchDay(selectedDay) {
        weeklySchedule[currentEditingDay] = getListData();
        currentEditingDay = selectedDay;
        renderPlaylistForDay(currentEditingDay);
    }

    function renderPlaylistForDay(day) {
        document.getElementById('playlist').innerHTML = '';
        const items = weeklySchedule[day] || [];
        items.forEach(x => createSceneHTML(x));
    }

    function getListData() {
        const arr = [];
        document.querySelectorAll(`.scene-item`).forEach(el => {
            arr.push({ 
                url: el.querySelector('.i-url').value, 
                title: el.querySelector('.i-title').value, 
                duration: el.querySelector('.i-dur').value 
            });
        });
        return arr;
    }

    function addScene() {
        createSceneHTML({ title: "ڤیدیۆی نوێ", duration: 3600, url: "" });
    }

    function createSceneHTML(data) {
        const id = Date.now() + Math.floor(Math.random()*100);
        const html = `
        <div class="scene-item" id="${id}">
            <i class="fa-solid fa-grip-vertical drag-handle" style="color: #555; cursor: grab; margin-left: 10px;"></i>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 5px;">
                <input type="text" class="i-title" value="${data.title || ''}" placeholder="ناوی سەرچاوە (Source)" style="background: transparent; border: none; font-weight: bold; padding: 0;">
                <input type="text" class="i-url" value="${data.url || ''}" placeholder="لینکی ڤیدیۆ..." dir="ltr" style="font-size: 11px; padding: 4px;">
                <input type="hidden" class="i-dur" value="${data.duration || 3600}">
            </div>
            <div class="scene-controls">
                <button onclick="this.closest('.scene-item').remove()"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>`;
        document.getElementById('playlist').insertAdjacentHTML('beforeend', html);
    }

    window.addEventListener('DOMContentLoaded', () => {
        new Sortable(document.getElementById('playlist'), { animation: 150, handle: '.drag-handle' });
    });

    function updateMonitors() {
        const url = document.getElementById('monitorUrl').value.trim();
        if(url.includes('ok.ru')) {
            let fUrl = url.includes('/videoembed/') ? url : url.replace('/video/', '/videoembed/');
            document.getElementById('pgmScreen').src = fUrl;
            document.getElementById('pvwScreen').src = fUrl; // For now, PVW mirrors PGM until WebRTC backend is built
        }
    }

    function saveDataToCloud(commandOverride = null) {
        if (isInitialLoad) return;
        weeklySchedule[currentEditingDay] = getListData();
        
        const data = {
            t: document.getElementById('tickerText').value, 
            l: document.getElementById('logoUrl').value,
            m: document.getElementById('monitorUrl').value,
            schedule: weeklySchedule 
        };
        
        const cmd = commandOverride || 'play_playlist';
        db.ref("system/mcr_data").set({ payload: JSON.stringify(data), command: cmd, timestamp: Date.now() });
    }

    function masterControl(cmd) {
        saveDataToCloud(cmd);
    }

    function setLiveStatus(status) {
        isLive = status;
        const badge = document.getElementById("airBadge");
        if (status) {
            badge.innerText = 'LIVE (ON AIR)'; badge.className = 'badge badge-live active';
        } else {
            badge.innerText = 'OFFLINE'; badge.className = 'badge badge-live'; 
        }
    }

    function quickInject() {
        const url = document.getElementById('quickUrl').value.trim();
        if(!url) return alert("سەرەتا لینک دابنێ!");
        
        db.ref("system/mcr_data").set({
            payload: JSON.stringify({
                play: [{ url: url, title: "بەپەلە (Override)", duration: 3600 }],
                n: "Media Bagera TV",
                l: document.getElementById('logoUrl').value
            }),
            command: 'override',
            timestamp: Date.now()
        });
        document.getElementById('quickUrl').value = '';
    }
</script>
</body>
</html>
