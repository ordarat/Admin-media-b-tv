<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveZon - Simple Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; color: #1f2937; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #2563eb; font-size: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; display: flex; align-items: center; gap: 10px;}
        label { font-size: 13px; font-weight: bold; margin-top: 15px; display: block; color: #4b5563; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-family: inherit; direction: ltr; text-align: left; resize: vertical;}
        input:focus, textarea:focus { outline: none; border-color: #2563eb; }
        .btn { width: 100%; padding: 14px; margin-top: 15px; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; color: white; display: flex; justify-content: center; align-items: center; gap: 8px;}
        .btn-blue { background-color: #2563eb; } .btn-blue:hover { background-color: #1d4ed8; }
        .btn-green { background-color: #10b981; } .btn-green:hover { background-color: #059669; }
        .btn-red { background-color: #ef4444; } .btn-red:hover { background-color: #dc2626; }
        
        .action-row { display: flex; gap: 10px; margin-top: 15px; }
        .action-row .btn { margin-top: 0; flex: 1; }

        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f3f4f6; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .status-bar { width: 100%; max-width: 600px; padding: 15px; background: #1e293b; color: white; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold; box-sizing: border-box;}
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="container" style="text-align: center;">
        <h2 style="justify-content: center; border: none;"><i class="fa-solid fa-lock"></i> چوونەژوورەوە</h2>
        <input type="email" id="loginEmail" placeholder="ئیمەیڵ">
        <input type="password" id="loginPass" placeholder="تێپەڕوشە">
        <button class="btn btn-blue" onclick="login()">چوونەژوورەوە</button>
    </div>
</div>

<div id="appContainer" style="display: none; width: 100%; display: flex; flex-direction: column; align-items: center;">
    
    <div class="status-bar" id="statusText">چاوەڕێی پەیوەندی...</div>

    <!-- بەشی ڤیدیۆ -->
    <div class="container">
        <h2><i class="fa-solid fa-video"></i> ١. پەخشی ڤیدیۆ</h2>
        <label>لینکی ڤیدیۆ یان پەخشی ڕاستەوخۆ (m3u8, mp4...)</label>
        <input type="text" id="videoUrl" placeholder="https://...">
        <button class="btn btn-blue" onclick="sendVideoCommand()"><i class="fa-solid fa-play"></i> دەستپێکردنی ڤیدیۆ</button>
    </div>

    <!-- بەشی وێنە و دەنگ -->
    <div class="container">
        <h2 style="color: #10b981;"><i class="fa-solid fa-images"></i> ٢. پەخشی وێنە (Slideshow) و مۆسیقا</h2>
        
        <label>لینکی وێنەکان (هەر لینکێک لە دێڕێکی نوێدا دابنێ)</label>
        <textarea id="imageUrl" rows="5" placeholder="https://image1.jpg&#10;https://image2.jpg&#10;https://image3.png"></textarea>
        
        <label>لینکی مۆسیقا یان دەنگ (MP3, MP4, AAC...)</label>
        <input type="text" id="audioUrl" placeholder="https://...">
        
        <!-- دوگمەکان -->
        <div class="action-row">
            <button class="btn btn-red" onclick="sendImageCommand()"><i class="fa-solid fa-images"></i> پەخشی وێنەکان</button>
            <button class="btn btn-blue" onclick="sendVideoCommand()"><i class="fa-solid fa-rotate-left"></i> گەڕانەوە بۆ ڤیدیۆ</button>
        </div>
    </div>

    <!-- بەشی هەواڵ و ڕێکخستن -->
    <div class="container">
        <h2 style="color: #6b7280;"><i class="fa-solid fa-newspaper"></i> ٣. شریتی هەواڵ و لۆگۆ</h2>
        <label>شریتی هەواڵ (Ticker Text)</label>
        <input type="text" id="tickerText" value="بەخێربێن بۆ کەناڵی میدیا باگێرا" dir="rtl" style="text-align: right;">
        <label>لینکی لۆگۆ</label>
        <input type="text" id="logoUrl" value="https://i.postimg.cc/Kv60DSRk/1000035211-removebg-preview.png">
        <button class="btn btn-green" onclick="updateSettings()"><i class="fa-solid fa-floppy-disk"></i> سەیڤکردن</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA_CyVB1f9UCHG_FMmYDSqG3oLGkohfE80",
        authDomain: "media-bagera-63d90.firebaseapp.com",
        databaseURL: "https://media-bagera-63d90-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "media-bagera-63d90",
        storageBucket: "media-bagera-63d90.firebasestorage.app",
        messagingSenderId: "457510380933",
        appId: "1:457510380933:web:c181b17a72d5e4a33dd0ec"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database(); 

    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            document.getElementById('statusText').innerText = "✅ پەیوەندی سەرکەوتوو بوو";
            loadSettings();
        } else {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appContainer').style.display = 'none';
        }
    });

    function login() {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;
        auth.signInWithEmailAndPassword(email, pass).catch(() => alert('هەڵە لە ئیمەیڵ یان وشەی نهێنی!'));
    }

    function loadSettings() {
        db.ref("system/mcr_data/payload").once("value", (snapshot) => {
            if(snapshot.exists()) {
                try {
                    const data = JSON.parse(snapshot.val());
                    if(data.ticker) document.getElementById('tickerText').value = data.ticker;
                    if(data.logo) document.getElementById('logoUrl').value = data.logo;
                    if(data.video) document.getElementById('videoUrl').value = data.video;
                    if(data.image) document.getElementById('imageUrl').value = data.image;
                    if(data.audio) document.getElementById('audioUrl').value = data.audio;
                } catch(e) {}
            }
        });
    }

    function sendVideoCommand() {
        const vUrl = document.getElementById('videoUrl').value.trim();
        if(!vUrl) return alert("تکایە سەرەتا لینکی ڤیدیۆ لە بەشی سەرەوە دابنێ!");
        
        const payload = JSON.stringify({
            video: vUrl,
            ticker: document.getElementById('tickerText').value,
            logo: document.getElementById('logoUrl').value
        });
        
        db.ref("system/mcr_data").set({ payload: payload, command: 'play_video', timestamp: Date.now() });
        document.getElementById('statusText').innerText = "▶️ فەرمانی پەخشی ڤیدیۆ نێردرا";
        document.getElementById('statusText').style.backgroundColor = "#2563eb";
    }

    function sendImageCommand() {
        const iUrl = document.getElementById('imageUrl').value.trim();
        const aUrl = document.getElementById('audioUrl').value.trim();
        if(!iUrl) return alert("تکایە بەلایەنی کەمەوە یەک لینکی وێنە دابنێ!");
        
        const payload = JSON.stringify({
            image: iUrl,
            audio: aUrl,
            ticker: document.getElementById('tickerText').value,
            logo: document.getElementById('logoUrl').value
        });
        
        db.ref("system/mcr_data").set({ payload: payload, command: 'play_image', timestamp: Date.now() });
        document.getElementById('statusText').innerText = "⏸️ ڤیدیۆ ڕاگیرا - وێنەکان پەخش دەکرێن";
        document.getElementById('statusText').style.backgroundColor = "#ef4444";
    }

    function updateSettings() {
        const payload = JSON.stringify({
            ticker: document.getElementById('tickerText').value,
            logo: document.getElementById('logoUrl').value,
            video: document.getElementById('videoUrl').value,
            image: document.getElementById('imageUrl').value,
            audio: document.getElementById('audioUrl').value
        });
        db.ref("system/mcr_data").set({ payload: payload, command: 'update_settings', timestamp: Date.now() });
        alert('ڕێکخستنەکان سەیڤ کران!');
    }
</script>
</body>
</html>
